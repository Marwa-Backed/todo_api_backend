<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Color Tasks</title>
<style>
body{font-family:sans-serif;background:#f0f2f5;display:flex;justify-content:center;padding:50px}
.box{background:white;padding:30px;border-radius:15px;width:400px}
h1{text-align:center}
.input-area{display:flex;gap:8px;margin-bottom:20px}
input[type="text"]{flex:1;padding:10px;border-radius:8px;border:1px solid #ddd}
button.add{background:#6c5ce7;color:white;border:none;padding:0 20px;border-radius:8px;cursor:pointer}
.task{padding:12px;border-radius:8px;margin-bottom:10px;display:flex;justify-content:space-between;font-weight:bold}
.task button{background:white;border:none;border-radius:50%;width:28px;height:28px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h1>🚀 My Tasks</h1>
<div class="input-area">
<input type="text" id="title" placeholder="اكتبي تاسك جديد...">
<button class="add" onclick="add()">Add</button>
</div>
<div id="list"></div>
</div>
<script>
const API='http://127.0.0.1:8000/api/tasks/';
const colors=["#ffeaa7","#fab1a0","#81ecec","#74b9ff","#a29bfe","#fd79a8","#55efc4"];
async function load(){
const res=await fetch(API);
const data=await res.json();
const list=document.getElementById('list');
list.innerHTML='';
data.forEach((t,i)=>{
const col=colors[i%colors.length];
list.innerHTML+=`<div class="task" style="background:${col}"><span onclick="toggle(${t.id},${t.completed})" style="text-decoration:${t.completed?'line-through':''};cursor:pointer">${t.title}</span><button onclick="del(${t.id})">X</button></div>`;
});
}
async function add(){
const el=document.getElementById('title');
const title=el.value;
if(!title)return;
await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title,completed:false})});
el.value='';
load();
}
async function del(id){await fetch(API+id+'/',{method:'DELETE'});load();}
async function toggle(id,comp){await fetch(API+id+'/',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed:!comp})});load();}
load();
</script>
</body>
</html>
